# Stos wdrożeniowy: aplikacja Streamlit za reverse proxy Caddy z automatycznym HTTPS (Let's Encrypt).
# Instrukcja: DEPLOY.md. Domena pochodzi z pliku .env (wzór: .env.example), a sam plik .env nie jest w repozytorium.
name: forecast

services:
  app:
    build: .
    image: forecast-app:latest
    restart: unless-stopped
    # Bez `ports`: aplikacja jest dostępna tylko w sieci compose, z zewnątrz wchodzi się przez proxy.
    expose:
      - "8501"
    read_only: true              # system plików kontenera tylko do odczytu
    tmpfs:
      - /tmp:mode=1777
      # Streamlit potrzebuje zapisywalnego katalogu domowego; uid i gid zgodne z użytkownikiem z Dockerfile.
      - /home/appuser:uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Na serwerze zostaw domyślne 80 i 443. Zmienne HTTP_PORT i HTTPS_PORT służą tylko do testu lokalnego.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?ustaw DOMAIN w pliku .env, wzór jest w .env.example}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # certyfikaty: zostają po restarcie i aktualizacji
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE           # nasłuch na portach 80 i 443
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
